services:
  globalnetbench:
    build:
      context: .
      args:
        VERSION: "0.1.0"
    image: globalnetbench:0.1.0
    container_name: globalnetbench
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/etc/globalnetbench/config.yaml:ro
      - gnb-data:/data
    # ICMP and traceroute need raw sockets; nothing else does.
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: globalnetbench-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: globalnetbench
      POSTGRES_PASSWORD: globalnetbench
      POSTGRES_DB: globalnetbench
    volumes:
      - gnb-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U globalnetbench"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional. The built-in dashboard does not need either of these.
  # Start them with: docker compose --profile observability up -d
  prometheus:
    image: prom/prometheus:latest
    container_name: globalnetbench-prometheus
    restart: unless-stopped
    profiles: [observability]
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - gnb-prometheus:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: globalnetbench-grafana
    restart: unless-stopped
    profiles: [observability]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - gnb-grafana:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  gnb-data:
  gnb-postgres:
  gnb-prometheus:
  gnb-grafana:
