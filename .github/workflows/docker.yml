name: Docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Validate the example configuration
        run: go run ./cmd/globalnetbench -config config.example.yaml -check

  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    needs: test
    # Pull requests are built to prove the Dockerfile still works, but only
    # trusted refs may push: a fork PR has no access to the registry secrets.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the image name
        id: image
        env:
          # Set the DOCKERHUB_IMAGE repository variable to override the default
          # of <docker hub user>/globalnetbench.
          OVERRIDE: ${{ vars.DOCKERHUB_IMAGE }}
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$OVERRIDE" ] && [ -z "$USERNAME" ]; then
            echo "Neither the DOCKERHUB_IMAGE variable nor the DOCKERHUB_USERNAME secret is set." >&2
            echo "See the Docker Hub publishing section of README.md." >&2
            exit 1
          fi
          echo "name=${OVERRIDE:-$USERNAME/globalnetbench}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          # The short commit SHA is the real version. Its explicit priority
          # outranks the default raw priority of 200 so that the SHA, rather
          # than "latest", becomes the version output baked into the binary.
          tags: |
            type=sha,format=short,prefix=,priority=1000
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=GlobalNetBench
            org.opencontainers.image.description=Self-hosted Internet connection benchmarking across world regions

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 matters here: this is a homelab tool and plenty of people run
          # it on a Raspberry Pi or an ARM VPS.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build-only:
    name: Build (no push)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
